name: CI

# 記事・データ・コードのどれが壊れてもここで止める。
# 型チェックとテストの対象は src だけでなく scripts / test も含む。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npm run check

      - name: モデルデータの形式
        run: npm run validate:data

      - name: 記事・用語・図・リンクの整合性
        run: npm run validate:content

      - name: AI図鑑データの整合性
        run: npm run validate:zukan

      - name: テスト
        run: npm test

      - name: 第32章サンプルのテスト
        run: cd samples/ch32-faq-assistant && node --test "test/*.test.mjs"

      - name: ビルド
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: GitHub Pages 用にビルド
        run: npm run build
        env:
          SITE_ORIGIN: https://5montest.github.io
          SITE_BASE: /ai-no-chizu

      - name: Pages を設定
        uses: actions/configure-pages@v5

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
